schema_version: 1.0.0
version: 1.3.0
name: taxonomy
description: Deterministic, explainable taxonomy for AIism detection.

detector_constraints:
  cold_code_only: true
  ai_api_calls_allowed: false
  explainable_rules_required: true

aliases:
  - AI tells
  - tell words
  - giveaways
  - markers
  - indicators
  - hallmarks
  - ChatGPT speak
  - GPT prose style
  - AI writing style
  - AI-ese
  - LLMish
  - ChatGPT cliches
  - slop words
  - crutch phrases
  - AI slop

categories:
  - id: phrase_tells
    label: Phrase Tells
    definition: Overused phrases and lexical choices strongly associated with model output.
    rules:
      - id: phrase.delve
        label: Delve usage
        definition: Unnaturally frequent use of delve as a transition verb.
        match_type: phrase
        patterns:
          - delve
          - delving into
        case_sensitive: false
        weight: 1.8
      - id: phrase.tapestry
        label: Tapestry metaphor
        definition: Generic abstract metaphor often used as filler.
        match_type: phrase
        patterns:
          - tapestry
        case_sensitive: false
        weight: 1.4
      - id: phrase.worth_noting
        label: Worth noting boilerplate
        definition: Formulaic setup phrase in canned explanatory style.
        match_type: phrase
        patterns:
          - it is worth noting that
          - it's worth noting that
        case_sensitive: false
        weight: 1.2
      - id: phrase.transition_stack
        label: Transition stackers
        definition: Frequent formal transitions that create robotic flow.
        match_type: phrase
        patterns:
          - furthermore
          - moreover
          - additionally
          - in conclusion
        case_sensitive: false
        weight: 1.0
      - id: phrase.certainly_preface
        label: Certainly preface
        definition: Overused certainty opener that can sound synthetic.
        match_type: phrase
        patterns:
          - certainly,
          - certainly
        case_sensitive: false
        weight: 0.8
      - id: phrase.its_not_just
        label: Not just / It's X, not Y
        definition: Contrast phrase used as a formulaic framing device.
        match_type: phrase
        patterns:
          - it's not just
          - this isn't just
          - that isn't just
          - it is not just
        case_sensitive: false
        weight: 1.0
      - id: phrase.crucial_preference
        label: Crucial emphasis
        definition: Unnecessarily emphatic generic marker often used as rhetorical filler.
        match_type: phrase
        patterns:
          - it is crucial
          - it's crucial
          - it is critically important
          - it's critically important
        case_sensitive: false
        weight: 0.8
      - id: phrase.tone_summary
        label: Frequent summary signposting
        definition: Lightweight recurring recap framing in short-form responses.
        match_type: phrase
        patterns:
          - in the end
          - at the end of the day
          - all things considered
          - to summarize briefly
        case_sensitive: false
        weight: 0.6
      - id: phrase.important_to_note
        label: Important to note boilerplate
        definition: Formulaic emphasis phrase common in generated text.
        match_type: phrase
        patterns:
          - it is important to note that
          - it's important to note that
        case_sensitive: false
        weight: 1.1
      - id: phrase.prestige_vocabulary
        label: Prestige word stack
        definition: Individually normal words that appear at abnormally high frequency in AI output.
        match_type: phrase
        patterns:
          - multifaceted
          - intricate
          - nuanced
          - pivotal
          - meticulous
          - comprehensive
          - profound
          - paramount
          - palpable
          - enigmatic
          - myriad
          - commendable
          - unwavering
        case_sensitive: false
        weight: 0.8
      - id: phrase.vibrant_vocabulary
        label: Sensory prestige words
        definition: Aesthetic and sensory words used at extreme overuse rates in AI text.
        match_type: phrase
        patterns:
          - vibrant
          - ethereal
          - luminous
          - radiant
          - pristine
          - breathtaking
          - kaleidoscope
          - symphony
          - mosaic
          - beacon
        case_sensitive: false
        weight: 1.0
      - id: phrase.action_verb_inflation
        label: Inflated action verbs
        definition: Dramatic verbs consistently chosen by AI where simpler alternatives exist.
        match_type: phrase
        patterns:
          - harness
          - unleash
          - unlock
          - empower
          - showcase
          - illuminate
          - underscore
          - resonate
          - embark
        case_sensitive: false
        weight: 0.6
      - id: phrase.nestled_scenic
        label: Nestled scenic cliche
        definition: Scenic setting cliche disproportionately common in AI location and travel writing.
        match_type: phrase
        patterns:
          - nestled in the heart of
          - nestled in
          - nestled among
          - nestled between
        case_sensitive: false
        weight: 1.2
      - id: phrase.dive_in
        label: Dive in and deep dive
        definition: Exploration invitation phrases distinct from delve but equally overused.
        match_type: phrase
        patterns:
          - let's dive in
          - let's dive deeper
          - let us dive in
          - deep dive
          - dive into
        case_sensitive: false
        weight: 1.0
      - id: phrase.seamless_robust
        label: Effortless perfection words
        definition: Words that paint everything as frictionless and reliable in a distinctly AI way.
        match_type: phrase
        patterns:
          - seamless
          - seamlessly
          - robust
          - effortless
          - effortlessly
        case_sensitive: false
        weight: 0.8

  - id: rhetorical_templates
    label: Rhetorical Templates
    definition: Repeated sentence templates often seen in generated prose.
    rules:
      - id: template.not_x_but_y
        label: Not X but Y template
        definition: Contrast framing that is overused in generated writing.
        match_type: regex
        patterns:
          - "\\b(?:it|this|that)\\s+(?:is|was|isn't|is not|wasn't|was not)\\s+[^.?!]{1,160}\\b(?:but\\s+rather|but|however|instead)\\b[^.?!]{1,140}"
          - "\\bnot\\s+because\\b[^.?!]{1,180}\\bbut\\s+because\\b[^.?!]{1,180}"
          - "\\bnot\\s+(?!only\\b)[^.?!]{5,160}\\bbut\\s+(?:rather\\s+)?[^.?!]{5,180}"
        case_sensitive: false
        weight: 2.0
      - id: template.not_x_its_y
        label: Not X, it's Y
        definition: Contrasting clause with repetition structure that can indicate templated output.
        match_type: regex
        patterns:
          - "\\b(?:it|this|that)\\s+(?:is|was|is not|was not|isn't|wasn't)\\s+not\\s+(?:just\\s+)?[^.?!]{1,80}\\s+(?:it's|it is|its)\\s+[^.?!]{1,120}"
          - "\\b(?:it|this|that)\\s+(?:is|was|is not|was not|isn't|wasn't)\\s+not\\s+[^.?!]{1,80}[—-][^.?!]{1,120}"
          - "\\b[^.?!]{1,120}\\b(?:is|are|was|were)\\s+not\\s+[^.?!]{1,100}[.?!]\\s+(?:it|they|this|that)\\s+(?:is|are|was|were)\\s+[^.?!]{1,120}"
        case_sensitive: false
        weight: 1.7
      - id: template.this_is_most
        label: This is the most signposting
        definition: Importance framing in definitive superlative language.
        match_type: regex
        patterns:
          - "\\bthis\\s+is\\s+(?:one\\s+of\\s+the\\s+)?most\\s+[^.?!]{1,80}"
        case_sensitive: false
        weight: 1.1
      - id: template.when_when_didactic
        label: When/When didactic mirror
        definition: Mirrored conditional teaching structure used in assistant-style exposition.
        match_type: regex
        patterns:
          - "\\bwhen\\s+[^.?!]{1,260}[.?!;:]\\s+when\\s+[^.?!]{1,260}"
          - "\\bwhen\\s+[^.?!]{1,260},\\s+when\\s+[^.?!]{1,260}"
        case_sensitive: false
        weight: 0.9
      - id: template.transforms_how_you
        label: Changes how you framing
        definition: Transformation promise language that presents conceptual shifts as total rewrites.
        match_type: regex
        patterns:
          - "\\b(?:understanding|once\\s+you\\s+internalize)\\s+this\\s+(?:changes|transforms)\\s+how\\s+you\\s+[^.?!]{1,80}"
          - "\\byour\\s+entire\\s+relationship\\s+with\\s+[^.?!]{1,80}\\s+changes\\b"
        case_sensitive: false
        weight: 1.1
      - id: template.this_is_declaration_density
        label: This-is declaration density
        definition: High rate of sentence-leading this is or it is declarations can indicate assistant-like rhetorical labeling.
        match_type: structural_ratio
        metric: this_is_sentences_per_100_sentences
        threshold: 4.5
        weight: 1.0
      - id: template.heres_the_thing
        label: Heres the thing
        definition: Conversational filler often inserted by chat models.
        match_type: phrase
        patterns:
          - and here's the thing
          - here's the thing
        case_sensitive: false
        weight: 1.4
      - id: template.honestly_preface
        label: Honestly preface
        definition: Repeated stance preface that reads as synthetic emphasis.
        match_type: phrase
        patterns:
          - and honestly
          - honestly,
        case_sensitive: false
        weight: 0.8
      - id: template.not_only_but_also
        label: Not only but also template
        definition: Symmetric contrast frame often repeated in generated prose.
        match_type: regex
        patterns:
          - "\\bnot only\\b[^.?!]{1,120}\\bbut also\\b[^.?!]{1,120}"
        case_sensitive: false
        weight: 1.3
      - id: template.on_one_hand_other
        label: On one hand on the other hand template
        definition: Balanced framing template used in canned explanations.
        match_type: regex
        patterns:
          - "\\bon the one hand\\b[^.?!]{1,200}\\bon the other hand\\b"
        case_sensitive: false
        weight: 1.2
      - id: template.no_x_no_y_just_z
        label: No X No Y Just Z template
        definition: Staccato negation-then-reveal template common in AI copy.
        match_type: regex
        patterns:
          - "\\bno\\s+\\w+[^.?!]{0,30}\\.\\s+no\\s+\\w+[^.?!]{0,30}\\.\\s+just\\s+[^.?!]{1,60}"
        case_sensitive: false
        weight: 1.3
      - id: template.that_being_said
        label: That being said transition
        definition: Formulaic concession transition overused in AI prose.
        match_type: phrase
        patterns:
          - that being said
          - "that said,"
          - having said that
          - with that being said
        case_sensitive: false
        weight: 0.8
      - id: template.at_its_core
        label: At its core framing
        definition: Reductive framing phrase used by LLMs to sound insightful.
        match_type: phrase
        patterns:
          - at its core
          - at its heart
          - at the heart of
          - "fundamentally,"
        case_sensitive: false
        weight: 0.7

  - id: formatting_tells
    label: Formatting Tells
    definition: Structural formatting that can look machine produced when overused.
    rules:
      - id: format.bullet_density
        label: High bullet density
        definition: Excessive bullet or list formatting compared to total text length.
        match_type: structural_ratio
        metric: bullet_lines_per_100_lines
        threshold: 18
        weight: 1.4
      - id: format.em_dash_density
        label: High em dash density
        definition: Heavy em dash usage as a stylistic crutch.
        match_type: structural_ratio
        metric: em_dash_per_1000_chars
        threshold: 1.7
        weight: 0.9
      - id: format.bold_italic_noise
        label: Bold italic noise
        definition: Frequent emphasis markup without semantic need.
        match_type: structural_ratio
        metric: emphasis_markup_lines_per_100_lines
        threshold: 8
        weight: 0.6
      - id: format.numbered_line_density
        label: High numbered list density
        definition: Too many numbered lines can indicate templated output.
        match_type: structural_ratio
        metric: numbered_lines_per_100_lines
        threshold: 14
        weight: 1.1
      - id: format.heading_density
        label: High heading density
        definition: Excessive heading segmentation can indicate assistant-like formatting.
        match_type: structural_ratio
        metric: markdown_heading_lines_per_100_lines
        threshold: 10
        weight: 0.8
      - id: format.paragraph_uniformity
        label: Paragraph length uniformity
        definition: AI produces paragraphs of suspiciously uniform length. Fires when inverse CV exceeds threshold.
        match_type: structural_ratio
        metric: paragraph_length_inv_cv
        threshold: 4.0
        weight: 1.2
      - id: format.sentence_uniformity
        label: Sentence length uniformity
        definition: Low burstiness in sentence length indicates AI-like regularity. Fires when inverse CV exceeds threshold.
        match_type: structural_ratio
        metric: sentence_length_inv_cv
        threshold: 3.3
        weight: 1.0

  - id: tone_tells
    label: Tone Tells
    definition: Hedging and generic abstraction that can create AI-like tone.
    rules:
      - id: tone.certainty_softener
        label: Certainty softener stack
        definition: Clustered hedges in local windows that reduce commitment.
        match_type: phrase
        patterns:
          - generally
          - typically
          - often
          - in many cases
          - may vary
        case_sensitive: false
        weight: 0.7
      - id: tone.over_summary
        label: Summary heavy closure
        definition: Frequent explicit recap language in short passages.
        match_type: phrase
        patterns:
          - to summarize
          - in summary
          - to wrap up
        case_sensitive: false
        weight: 1.0
      - id: tone.depends_context
        label: Depends on context hedge
        definition: Generic context hedge that can appear repeatedly in model output.
        match_type: phrase
        patterns:
          - it depends on context
          - depends on the context
          - this can vary depending on
        case_sensitive: false
        weight: 0.9
      - id: tone.generic_abstraction
        label: Generic abstraction language
        definition: Broad abstraction without concrete detail.
        match_type: phrase
        patterns:
          - in today's world
          - across industries
          - a wide range of scenarios
          - various factors
        case_sensitive: false
        weight: 0.9
      - id: tone.affirmation_loop
        label: Reassurance reassurance
        definition: Repeated emotional reassurance and softening phrases that can feel over-generated.
        match_type: phrase
        patterns:
          - not broken
          - you are not broken
          - you are not wrong
          - that's a very human reaction
        case_sensitive: false
        weight: 0.7
      - id: tone.overly_positive_closure
        label: Overly positive conclusion
        definition: Upbeat closing regardless of how negative or serious the preceding content is.
        match_type: phrase
        patterns:
          - on a positive note
          - there is hope
          - the good news is
          - looking on the bright side
          - silver lining
        case_sensitive: false
        weight: 0.7

  - id: assistant_disclaimer_tells
    label: Assistant Disclaimer Tells
    definition: Explicit capability and safety disclaimers common in assistant output.
    rules:
      - id: disclaimer.as_ai_model
        label: As an AI language model disclaimer
        definition: Self-identification disclaimer strongly associated with AI responses.
        match_type: phrase
        patterns:
          - as an ai language model
          - as a language model
        case_sensitive: false
        weight: 3.0
      - id: disclaimer.no_realtime_access
        label: No realtime access disclaimer
        definition: Limitation statement about internet or realtime access.
        match_type: phrase
        patterns:
          - i cannot browse the internet
          - i don't have real-time access
          - i do not have real-time access
        case_sensitive: false
        weight: 2.4
      - id: disclaimer.professional_advice
        label: Professional advice disclaimer
        definition: Generic warning footer often emitted by assistants.
        match_type: phrase
        patterns:
          - this is not a substitute for professional advice
          - consult a qualified professional
        case_sensitive: false
        weight: 1.6
      - id: disclaimer.capability_boundary
        label: Capability boundary statement
        definition: Explicit inability phrasing around access or actions.
        match_type: regex
        patterns:
          - "\\bi\\s+(?:can't|cannot|do not|don't)\\s+(?:access|view|open|retrieve)\\b"
        case_sensitive: false
        weight: 1.7

  - id: assistant_scaffolding_tells
    label: Assistant Scaffolding Tells
    definition: Conversational scaffolding and offer language typical of assistants.
    rules:
      - id: scaffold.break_it_down
        label: Break it down scaffold
        definition: Instructional setup phrase common in AI explanations.
        match_type: phrase
        patterns:
          - let's break it down
          - let us break it down
          - let's walk through this
        case_sensitive: false
        weight: 1.3
      - id: scaffold.key_takeaways
        label: Key takeaways scaffold
        definition: Packaged recap heading language commonly generated by assistants.
        match_type: phrase
        patterns:
          - key takeaways
          - key takeaway
          - "takeaway:"
          - "takeaways:"
        case_sensitive: false
        weight: 0.5
      - id: scaffold.consider_scenario
        label: Consider scenario opener
        definition: Instructional hypothetical opener common in assistant-mode teaching.
        match_type: regex
        patterns:
          - "\\b(?:now\\s+)?consider\\s+(?:a|an|the|two|three|[A-Z][a-z]+)\\b"
        case_sensitive: false
        weight: 0.9
      - id: scaffold.offer_follow_up
        label: Offer follow up help
        definition: Service-style follow-up offer phrase.
        match_type: regex
        patterns:
          - "\\bif you'd like,?\\s+i can\\b"
          - "\\blet me know if you want me to\\b"
        case_sensitive: false
        weight: 1.5
      - id: scaffold.heres_a_quick
        label: Here is a quick scaffold
        definition: Quick-summary intro phrase often used by assistants.
        match_type: phrase
        patterns:
          - here's a quick breakdown
          - here is a quick breakdown
          - here's a quick summary
          - here is a quick summary
        case_sensitive: false
        weight: 1.1
      - id: scaffold.hope_help
        label: Polite closure offers
        definition: Service-style closure language used to soften responses.
        match_type: phrase
        patterns:
          - i hope this helps
          - i hope that helps
          - let me know if you need
          - i'm happy to help
          - if you have any questions
        case_sensitive: false
        weight: 0.9
      - id: scaffold.email_opener
        label: Professional email opener
        definition: Formulaic email greeting strongly associated with AI-drafted correspondence.
        match_type: phrase
        patterns:
          - i hope this email finds you well
          - i hope this finds you well
          - i hope this message finds you well
        case_sensitive: false
        weight: 1.2
      - id: scaffold.refinement_offer
        label: Refinement and tweak offer
        definition: Output-iteration offer language specific to AI assistant workflows.
        match_type: phrase
        patterns:
          - let me know if you want any further refinements
          - let me know if you'd like any more tweaks
          - would you like me to adjust
          - shall i refine
        case_sensitive: false
        weight: 1.3

  - id: slop_phrase_tells
    label: Slop Phrase Tells
    definition: Repetitive sensory or melodramatic phrase fragments commonly reported as AI slop style.
    rules:
      - id: slop.shivers_down_my_spine
        label: Shivers down my spine
        definition: Repeated atmospheric phrase often overused in LLM style completion snippets.
        match_type: phrase
        patterns:
          - shivers down my spine
          - got me excited
          - got me goosebumps
          - gave me goosebumps
        case_sensitive: false
        weight: 1.0
      - id: slop.repetitive_if_then
        label: Repetitive conditional response
        definition: Mechanical if-then narration pattern with repetitive promise structure.
        match_type: regex
        patterns:
          - "\\bif\\s+[^.?!]{1,140}\\s+(?:i\\'ll|i will|i'll)\\s+[^.?!]{1,120}"
        case_sensitive: false
        weight: 0.8
      - id: slop.tell_me
        label: Tell-me echo pattern
        definition: High-frequency quote/repeat preface in roleplay or scripted outputs.
        match_type: phrase
        patterns:
          - tell me
          - they said
          - this is how i should
        case_sensitive: false
        weight: 0.6

  - id: engagement_glaze_tells
    label: Engagement Glaze Tells
    definition: Over-validating or engagement-seeking phrasing frequently reported in assistant-like output.
    rules:
      - id: glaze.great_question
        label: Great-question validation
        definition: Generic praise openers that can sound model-like when repeated.
        match_type: phrase
        patterns:
          - great question
          - great catch
        case_sensitive: false
        weight: 0.9
      - id: glaze.callout_validation
        label: Callout validation scripts
        definition: Apology-and-validation boilerplate often used in assistant recovery turns.
        match_type: phrase
        patterns:
          - you're right to call me out on it
          - you are right to call me out on it
          - you caught that, huh?
          - that makes perfect sense
          - now you're really thinking like
        case_sensitive: false
        weight: 1.0
      - id: glaze.engagement_prompt
        label: Engagement bait closers
        definition: Prompting for interaction with canned social engagement phrasing.
        match_type: phrase
        patterns:
          - i'm curious what others think
          - what do you think?
          - does this resonate?
        case_sensitive: false
        weight: 0.7
      - id: glaze.absolute_agreement
        label: Absolute agreement opener
        definition: Overenthusiastic agreement words used as sentence openers.
        match_type: phrase
        patterns:
          - "absolutely!"
          - "absolutely,"
          - "exactly!"
          - "precisely!"
        case_sensitive: false
        weight: 0.8

  - id: question_hook_tells
    label: Question Hook Tells
    definition: Short rhetorical hook questions and reveal-style pivots common in templated AI copy.
    rules:
      - id: hooks.kicker_issue
        label: Kicker issue hooks
        definition: Formulaic lead-ins that pivot with dramatic question fragments.
        match_type: phrase
        patterns:
          - the kicker?
          - the issue?
          - the real issue?
          - here's the twist
          - but here's the twist
          - the best part?
          - the worst part?
        case_sensitive: false
        weight: 1.0
      - id: hooks.cringy_question_style
        label: Cringy reveal question style
        definition: Over-scripted reveal questions often cited in AI slop discussions.
        match_type: regex
        patterns:
          - "\\b(?:and\\s+)?do\\s+you\\s+know\\s+what\\s+i\\s+learned\\s+from\\s+all\\s+this\\?"
        case_sensitive: false
        weight: 1.1
      - id: hooks.result_question
        label: Result and outcome question fragment
        definition: Reveal-question fragments that tee up a conclusion or verdict.
        match_type: phrase
        patterns:
          - the result?
          - the outcome?
          - the takeaway?
          - the verdict?
          - the bottom line?
        case_sensitive: false
        weight: 0.9

  - id: balanced_safety_templates
    label: Balanced Safety Templates
    definition: Over-hedged balancing templates that prioritize safe symmetry over specificity.
    rules:
      - id: balance.while_true_consider
        label: While true must also consider
        definition: Symmetric balancing frame that hedges by pairing every claim with a safety qualifier.
        match_type: regex
        patterns:
          - "\\bwhile\\s+it'?s\\s+true\\s+that\\s+[^.?!]{1,140},\\s+(?:it|we|you)\\s+(?:must|should)\\s+also\\s+(?:consider|acknowledge|remember)\\s+[^.?!]{1,120}"
          - "\\bwhile\\s+it\\s+is\\s+true\\s+that\\s+[^.?!]{1,140},\\s+(?:it|we|you)\\s+(?:must|should)\\s+also\\s+(?:consider|acknowledge|remember)\\s+[^.?!]{1,120}"
        case_sensitive: false
        weight: 1.1
      - id: balance.hedged_preface
        label: Hedged balance preface
        definition: Repeated prefacing that softens claims into cautious, generic framing.
        match_type: phrase
        patterns:
          - while it's true that
          - while it is true that
          - more often than not
        case_sensitive: false
        weight: 0.6

  - id: marketing_buzzword_tells
    label: Marketing Buzzword Tells
    definition: SEO and growth-marketing stock language frequently amplified by text generators.
    rules:
      - id: seo.next_level
        label: Next level up-sell framing
        definition: Generic optimization slogan pattern frequently used in AI-assisted copy.
        match_type: regex
        patterns:
          - "\\btake\\s+your\\s+[^.?!]{1,80}\\s+to\\s+the\\s+next\\s+level\\b"
        case_sensitive: false
        weight: 1.0
      - id: seo.navigate_landscape
        label: Navigate the landscape framing
        definition: Abstract strategy framing phrased in stereotyped consultancy language.
        match_type: phrase
        patterns:
          - navigating the landscape of
          - navigating the complexities of
          - based on the information provided
          - in the realm of
          - in stark contrast to
        case_sensitive: false
        weight: 0.9
      - id: seo.testament_clear
        label: Testament and certainty framing
        definition: Definitive certainty and authority cues commonly overused in generated marketing prose.
        match_type: phrase
        patterns:
          - a testament to
          - one thing is clear
          - one thing is certain
          - and with that
          - with that
          - in that moment
          - so here's to
        case_sensitive: false
        weight: 0.9
      - id: seo.buzzword_stack
        label: Marketing buzzword stack
        definition: Repeated growth and innovation buzzwords typical of polished AI marketing tone.
        match_type: phrase
        patterns:
          - revolutionize
          - streamline
          - groundbreaking
          - cutting-edge
          - elevate
          - fostering
        case_sensitive: false
        weight: 0.5
      - id: seo.game_changer
        label: Game changer and supercharge framing
        definition: Hype buzzwords common in AI-assisted marketing and copywriting.
        match_type: phrase
        patterns:
          - game changer
          - game-changer
          - supercharge
          - secret sauce
          - unprecedented
          - paradigm shift
          - synergy
        case_sensitive: false
        weight: 0.6

  - id: blog_cliche_tells
    label: Blog Cliche Tells
    definition: Boilerplate blog setup and CTA phrases commonly reused by AI drafting tools.
    rules:
      - id: blog.cta_hooks
        label: CTA cliche hooks
        definition: Formulaic intro and call-to-action templates common in low-effort AI blog copy.
        match_type: phrase
        patterns:
          - without further ado
          - if you're anything like me
          - if you are anything like me
          - now, this might make you wonder
        case_sensitive: false
        weight: 0.8
      - id: blog.ever_wondered_why
        label: Have-you-ever-wondered hook
        definition: Generic curiosity hook often used as a template opener.
        match_type: regex
        patterns:
          - "\\bhave\\s+you\\s+ever\\s+wondered\\s+why\\b"
        case_sensitive: false
        weight: 0.8
      - id: blog.power_and_everyone
        label: Everyone wants and power framing
        definition: Broad motivational claims that read like generated persuasion boilerplate.
        match_type: regex
        patterns:
          - "\\beveryone\\s+wants\\s+to\\s+[^.?!]{1,90}"
          - "\\byou\\s+have\\s+the\\s+power\\s+to\\s+[^.?!]{1,90}"
        case_sensitive: false
        weight: 0.7
      - id: blog.ever_evolving_world
        label: Ever-evolving world setup
        definition: Generic trend-context setup phrase often used in synthetic intros.
        match_type: regex
        patterns:
          - "\\bin\\s+today'?s\\s+ever-?evolving\\s+[^.?!]{1,80}\\s+environment\\b"
        case_sensitive: false
        weight: 0.7

  - id: fiction_melodrama_tells
    label: Fiction Melodrama Tells
    definition: Repetitive dramatic and sensory cliches frequently reported in AI-written fiction outputs.
    rules:
      - id: fiction.dialogue_tropes
        label: Recycled dialogue tropes
        definition: Character lines and tropes that recur unnaturally across generated scenes.
        match_type: phrase
        patterns:
          - and yet, here you are
          - you'll never have to find out
          - you're going to be the death of me
          - with practiced ease
        case_sensitive: false
        weight: 1.0
      - id: fiction.sensory_cliches
        label: Sensory cliche stack
        definition: Overused sensory fragments and scene-setting motifs in generated fiction.
        match_type: phrase
        patterns:
          - running on coffee and regret
          - running on coffee and questionable decisions
          - barely above a whisper
          - breath hitched
          - pulse quickened
          - casting long shadows
          - metallic tang
          - jasmine and sandalwood
        case_sensitive: false
        weight: 0.9
      - id: fiction.existential_dread_smell
        label: Existential dread smell simile
        definition: Hyper-specific smell cliche pattern that appears as repeated AI trope language.
        match_type: regex
        patterns:
          - "\\bsmell(?:ed|s)?\\s+like\\s+[^.?!]{1,60}\\s+and\\s+existential\\s+dread\\b"
        case_sensitive: false
        weight: 1.0
      - id: fiction.body_reaction_cliches
        label: Body reaction cliches
        definition: Involuntary body reactions from a narrow AI repertoire.
        match_type: phrase
        patterns:
          - heart skipped a beat
          - heart pounding
          - jaw clenched
          - stomach churned
          - blood ran cold
          - knuckles whitened
          - a single tear
          - couldn't help but feel
          - couldn't help but notice
          - can't help but
        case_sensitive: false
        weight: 0.9
      - id: fiction.atmosphere_cliches
        label: Atmosphere setting cliches
        definition: Repetitive atmospheric scene-setting fragments in generated fiction.
        match_type: phrase
        patterns:
          - loomed
          - looming
          - flickered
          - flickering
          - shimmered
          - shimmering
          - vise-like grip
          - mask of indifference
          - carried the weight
          - moth to a flame
          - dawn broke
        case_sensitive: false
        weight: 0.7
      - id: fiction.character_name_bias
        label: AI default character names
        definition: Character names from the narrow default distribution of AI fiction generators.
        match_type: phrase
        patterns:
          - Elara
          - Elena
          - Marcus
          - Sarah
          - Emily
          - Blackwood
          - Thompson
          - Lyra
        case_sensitive: true
        weight: 0.5

aggregation:
  base_score_formula: sum(rule_weight * rule_match_count_capped)
  rule_match_cap_per_500_words: 3
  category_diversity_bonus:
    enabled: true
    bonus_if_categories_hit_at_least: 3
    bonus_weight: 1.2
  minimum_evidence_rules_triggered: 2

classification_thresholds:
  low:
    min_score: 0
    max_score: 3.49
  moderate:
    min_score: 3.5
    max_score: 7.99
  high:
    min_score: 8.0
    max_score: 999

report_schema:
  total_ai_isms: integer
  matches:
    - rule_id
    - category_id
    - matched_text
    - start_char
    - end_char
    - weight
  category_breakdown:
    - category_id
    - count
    - weighted_score
  definitions:
    keyed_by: rule_id
  density: low_or_moderate_or_high
  aiism_score: non_negative_number
  aiism_ratio: percentage_0_to_100_plus
